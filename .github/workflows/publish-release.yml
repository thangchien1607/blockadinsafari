name: Publish release

description: >-
  Tags the release commit, builds, tests, mirrors to the public repo,
  and creates a GitHub Release on the public mirror
  (AdguardTeam/BlockYouTubeAdsShortcut) with built artifacts, then notifies
  Slack.

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to publish manually
        required: false
        type: string

jobs:
  tag:
    # No local `if:` guard — tag-from-changelog.yml@master already gates on
    # `merged == true && head.ref startsWith 'release-bump/'` for PR events.
    uses: AdGuardSoftwareLimited/actions/.github/workflows/tag-from-changelog.yml@master
    with:
      ref: ${{ inputs.ref || github.event.pull_request.merge_commit_sha || github.ref_name }}
      team: extensions
    # `contents: write` — create the git tag
    permissions:
      contents: write

  build:
    name: Test and build
    needs: tag
    runs-on: team-extensions
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.event.pull_request.merge_commit_sha || github.ref_name }}

      # Version is parsed from CHANGELOG by the tag job and injected
      # here so the compiled scripts carry the release tag.
      - name: Inject version into package.json
        run: npm pkg set version="${{ needs.tag.outputs.version }}"

      - name: Lint and test
        run: DOCKER_BUILDKIT=1 docker build --progress plain --target test-output .

      - name: Build release artifacts
        run: DOCKER_BUILDKIT=1 docker build --progress plain --target build-output --output ./artifacts .

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: artifacts/

  mirror-and-release:
    # Mirrors the repo (including the tag) to the public mirror and
    # creates a matching GitHub Release on AdguardTeam/BlockYouTubeAdsShortcut.
    needs: [tag, build]
    uses: AdGuardSoftwareLimited/actions/.github/workflows/mirror-and-release.yml@master
    with:
      team: extensions
      target_repo: AdguardTeam/BlockYouTubeAdsShortcut
      tag: ${{ needs.tag.outputs.tag }}
      changelog: ${{ needs.tag.outputs.changelog }}
      artifact_name: release-files
    secrets: inherit
    # `actions: write` — disable workflows in the public mirror
    # `contents: write` — create GitHub Release on public repo
    # `id-token: write` — Octopass token for mirror push
    permissions:
      actions: write
      contents: write
      id-token: write

  notify:
    name: Notify
    needs: [tag, mirror-and-release]
    if: ${{ always() && needs.tag.result == 'success' }}
    runs-on: team-extensions
    steps:
      - name: Build message
        id: msg
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ needs.mirror-and-release.result }}" = "success" ]; then
            echo "text=:white_check_mark: *ext-block-youtube-ads-shortcut* *${{ needs.tag.outputs.tag }}* released (GitHub Release on public mirror) — <${{ needs.mirror-and-release.outputs.release-url }}|release> | <${run_url}|run>" >> "$GITHUB_OUTPUT"
            echo "color=good" >> "$GITHUB_OUTPUT"
          else
            echo "text=:cross-mark: *ext-block-youtube-ads-shortcut* *${{ needs.tag.outputs.tag }}* release failed (release: ${{ needs.mirror-and-release.result }}) — <${run_url}|run>" >> "$GITHUB_OUTPUT"
            echo "color=danger" >> "$GITHUB_OUTPUT"
          fi
      - name: Send Slack notification
        uses: AdGuardSoftwareLimited/actions/actions/slack@master
        with:
          channel: '#adguard-extension-vcs'
          message: ${{ steps.msg.outputs.text }}
          color: ${{ steps.msg.outputs.color }}
